name: Otzaria OpenAI-compatible thought signatures
on:
  push:
    branches: [codex/otzaria-tool-result-continuation-20261123]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: otzaria-shared-stream-continuation
  cancel-in-progress: false
jobs:
  thought-signatures:
    runs-on: macos-26-intel
    timeout-minutes: 55
    env:
      AGENT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Admit the corrected fixture and 4193 authentic retained passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/otzaria-thought-signature-evidence.py prepare
      - uses: actions/cache@v4
        with:
          path: .build
          key: otzaria-stream-macos26-${{ runner.arch }}-${{ hashFiles('Package.resolved', '.evidence/swift-version.txt') }}
      - name: Run only the one failed original streamText continuation test
        shell: bash
        run: |
          set -uo pipefail
          set +e
          swift test --filter StreamTextThoughtSignatureContinuationTests --xunit-output .evidence/focused-suite.xml 2>&1 | tee .evidence/focused-suite.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > .evidence/swift-exit.txt
          exit "$result"
      - name: Verify one actual pass plus 4193 unchanged retained passes
        if: always()
        run: python3 scripts/otzaria-thought-signature-evidence.py finalize
      - name: Seal retained evidence
        if: always()
        run: python3 scripts/otzaria-thought-signature-evidence.py index
      - name: Retain exact source and actual Apple evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otzaria-thought-signature-evidence
          path: .evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
